<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Transparent or dark background - adjust as needed -->
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- Large central circle -->
  <circle cx="200" cy="200" r="45" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Medium particles - ring 1 -->
  <circle cx="130" cy="160" r="20" fill="#ff6b6b" opacity="0.7" filter="url(#glow)"/>
  <circle cx="270" cy="160" r="20" fill="#4ecdc4" opacity="0.7" filter="url(#glow)"/>
  <circle cx="150" cy="240" r="18" fill="#45b7d1" opacity="0.6" filter="url(#glow)"/>
  <circle cx="250" cy="240" r="18" fill="#96ceb4" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Small particles - ring 2 -->
  <circle cx="100" cy="200" r="12" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="300" cy="200" r="12" fill="#4ecdc4" opacity="0.5"/>
  <circle cx="160" cy="130" r="10" fill="#45b7d1" opacity="0.4"/>
  <circle cx="240" cy="130" r="10" fill="#96ceb4" opacity="0.4"/>
  <circle cx="170" cy="270" r="10" fill="#ff6b6b" opacity="0.4"/>
  <circle cx="230" cy="270" r="10" fill="#4ecdc4" opacity="0.4"/>
  
  <!-- Tiny particles - outer ring -->
  <circle cx="80" cy="180" r="6" fill="#ff6b6b" opacity="0.3"/>
  <circle cx="320" cy="180" r="6" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="140" cy="110" r="6" fill="#45b7d1" opacity="0.3"/>
  <circle cx="260" cy="110" r="6" fill="#96ceb4" opacity="0.3"/>
  <circle cx="120" cy="290" r="6" fill="#ff6b6b" opacity="0.3"/>
  <circle cx="280" cy="290" r="6" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="90" cy="220" r="5" fill="#45b7d1" opacity="0.3"/>
  <circle cx="310" cy="220" r="5" fill="#96ceb4" opacity="0.3"/>
  
  <!-- Micro particles - scattered -->
  <circle cx="70" cy="150" r="4" fill="#ff6b6b" opacity="0.2"/>
  <circle cx="330" cy="150" r="4" fill="#4ecdc4" opacity="0.2"/>
  <circle cx="110" cy="100" r="4" fill="#45b7d1" opacity="0.2"/>
  <circle cx="290" cy="100" r="4" fill="#96ceb4" opacity="0.2"/>
  <circle cx="100" cy="300" r="4" fill="#ff6b6b" opacity="0.2"/>
  <circle cx="300" cy="300" r="4" fill="#4ecdc4" opacity="0.2"/>
  <circle cx="60" cy="240" r="3" fill="#45b7d1" opacity="0.2"/>
  <circle cx="340" cy="240" r="3" fill="#96ceb4" opacity="0.2"/>
  
  <!-- Central Letter A -->
  <text x="200" y="225" font-family="Inter, Arial, sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="middle">
    A
  </text>
</svg>